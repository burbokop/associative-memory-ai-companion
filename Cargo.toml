[package]
name = "associative-memory-ai-companion"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "companion"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
colored = "3.1.1"
dirs = "7.0.0"
reqwest = { version = "0.13.5", features = ["json"] }
rustyline = "19.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
whoami = "2.1.3"
